
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: python3 -m ruff check src tests
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-format
        name: Ruff format check
        entry: python3 -m ruff format --check src tests
        language: system
        pass_filenames: false
        always_run: true

      - id: mypy
        name: Mypy
        entry: python3 -m mypy src tests
        language: system
        pass_filenames: false
        always_run: true
