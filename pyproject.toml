
[project]
name = "mediateka"
version = "0.1.0"
description = "Лабораторная работа 3. Каталог медиаматериалов"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
